name: pf-probe

on:
  workflow_dispatch:
    inputs:
      tests:
        description: "Tests to run"
        default: "hashes,token,hashcmp,albums,ramp"
      levels:
        description: "Concurrency levels for ramp"
        default: "3,8,12,16"
      token_rounds:
        description: "Token mint rounds"
        default: "30"

permissions:
  contents: read

concurrency:
  group: pf-probe
  cancel-in-progress: false

jobs:
  pf-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Source
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.SRC_REPO }}
          ssh-key: ${{ secrets.SRC_KEY }}
          path: src
          sparse-checkout: /atlas/
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run probe (counts only)
        run: |
          node src/atlas/scripts/pf-probe.mjs \
            --ids src/atlas/scripts/pf-probe-ids.json \
            --out "$RUNNER_TEMP/pf-out" \
            --tests "${{ inputs.tests }}" \
            --levels "${{ inputs.levels }}" \
            --token-rounds "${{ inputs.token_rounds }}"

      - name: Leak check before upload (numbers-only file)
        if: always()
        run: |
          f="$RUNNER_TEMP/pf-out/summary.json"
          [ -f "$f" ] || exit 0
          if grep -qE '[A-Za-z0-9]{22}|accessToken|Bearer' "$f"; then
            echo "leak check failed"; rm -f "$f"; exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pf-probe-results
          path: ${{ runner.temp }}/pf-out/summary.json
          retention-days: 7
          if-no-files-found: ignore
