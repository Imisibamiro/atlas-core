# Automatically retries failed jobs in a failed daily refresh fanout run.
# Manual reruns (attempt > 1) are ignored.
name: "Auto rerun"

on:
  workflow_run:
    workflows: ["Run"]
    types: [completed]

permissions:
  actions: write
  contents: read

concurrency:
  group: auto-rerun-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  rerun:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      REPO: ${{ github.repository }}
    steps:
      - name: Only daily refresh fanout runs
        id: fanout
        run: |
          jobs="$(gh api repos/$REPO/actions/runs/$RUN_ID/jobs --paginate --jq '.jobs[] | select(.conclusion != "skipped") | .name')"
          if ! printf '%s\n' "$jobs" | grep -q '^finalize-fanout'; then
            echo "Not a fanout run; nothing to do"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Rerun failed jobs (max 2)
        if: steps.fanout.outputs.skip != 'true'
        run: |
          for try in 1 2; do
            sleep 600
            gh run rerun "$RUN_ID" --failed --repo "$REPO"
            sleep 60
            if gh run watch "$RUN_ID" --repo "$REPO" --exit-status --interval 120; then
              echo "Recovered on retry $try"
              exit 0
            fi
          done
          echo "::error::Still failing after 2 automatic retries"
          exit 1
