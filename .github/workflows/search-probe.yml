name: search-probe

on:
  workflow_dispatch:
    inputs:
      modes:
        description: "Browser modes to try"
        default: "headless,xvfb"

permissions:
  contents: read

concurrency:
  group: search-probe
  cancel-in-progress: false

jobs:
  search-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: |
          pip install -q TikTokApi==7.3.5
          python -m playwright install --with-deps chromium > /dev/null 2>&1
          sudo apt-get install -y -q xvfb > /dev/null 2>&1
          echo "egress country: $(curl -s https://ipinfo.io/country)"
      - name: Probe
        env:
          PROBE_QUERIES: ${{ secrets.TT_PROBE_QUERIES }}
          MODES: ${{ inputs.modes }}
        run: |
          cat > probe.py <<'PY'
          import asyncio, json, os, sys, time
          from TikTokApi import TikTokApi
          queries = json.loads(os.environ["PROBE_QUERIES"])
          mode = sys.argv[1]
          async def main():
              out = []
              async with TikTokApi(logging_level=50) as api:
                  await api.create_sessions(num_sessions=1, sleep_after=5, browser="chromium",
                                            headless=(mode == "headless"))
                  for i, q in enumerate(queries):
                      sounds, err = {}, None
                      try:
                          async for v in api.search.search_type(q, "item", count=12):
                              m = v.as_dict.get("music") or {}
                              k = m.get("id")
                              if not k:
                                  continue
                              s = sounds.setdefault(k, {"id": k, "title": m.get("title"),
                                                        "author": m.get("authorName"),
                                                        "original": m.get("original"), "hits": 0})
                              s["hits"] += 1
                      except Exception as e:
                          err = type(e).__name__
                      out.append({"i": i, "error": err, "sounds": list(sounds.values())})
                      time.sleep(3)
              json.dump(out, open(f"res-{mode}.json", "w"))
              ok = sum(1 for r in out if r["sounds"])
              print(f"mode={mode} answered={ok}/{len(out)} sounds={sum(len(r['sounds']) for r in out)}")
          asyncio.run(main())
          PY
          for m in ${MODES//,/ }; do
            if [ "$m" = "xvfb" ]; then xvfb-run -a python probe.py xvfb || echo "mode=xvfb failed"
            else python probe.py "$m" || echo "mode=$m failed"; fi
          done
      - name: Seal
        env:
          PROBE_KEY: ${{ secrets.TT_PROBE_KEY }}
        run: |
          tar czf - res-*.json 2>/dev/null | openssl enc -aes-256-cbc -pbkdf2 -pass env:PROBE_KEY -out res.enc
          ls -l res.enc | awk '{print "sealed bytes:", $5}'
      - uses: actions/upload-artifact@v4
        with:
          name: res
          path: res.enc
          retention-days: 1
