name: speech-bench

on:
  workflow_dispatch:
    inputs:
      audio_url:
        description: "Direct audio link"
        required: true
      window:
        description: "Start-end, hh:mm:ss-hh:mm:ss"
        default: "00:00:30-00:03:30"
      models:
        description: "Comma-separated model ids"
        default: "NCAIR1/Yoruba-ASR,NCAIR1/Igbo-ASR"

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -q transformers librosa
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: speech-bench-models-v1
      - name: Prepare audio
        env:
          AUDIO_URL: ${{ inputs.audio_url }}
          WINDOW: ${{ inputs.window }}
        run: |
          curl -sfL "$AUDIO_URL" -o full.audio
          ffmpeg -loglevel error -y -ss "${WINDOW%-*}" -to "${WINDOW#*-}" -i full.audio -ar 16000 -ac 1 clip.wav
          mkdir pieces
          ffmpeg -loglevel error -i clip.wav -f segment -segment_time 10 pieces/p%03d.wav
          echo "pieces: $(ls pieces | wc -l)"
      - name: Time models
        env:
          MODELS: ${{ inputs.models }}
        run: |
          IFS=',' read -ra list <<< "$MODELS"
          for m in "${list[@]}"; do python tools/speech/bench.py "$m" pieces || echo "[$m] failed"; done
