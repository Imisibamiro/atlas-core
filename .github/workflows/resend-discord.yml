name: Resend GA to Discord

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resend:
    runs-on: ubuntu-latest
    steps:
      - name: Source
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.SRC_REPO }}
          ssh-key: ${{ secrets.SRC_KEY }}
          path: src
          sparse-checkout: /atlas/
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: /tmp/st
          key: st-resend
          restore-keys: |
            st-

      - name: Send message from cached report
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          REPORT_FILE: /tmp/st/r.md
        run: python3 src/atlas/scripts/ga-resend.py
