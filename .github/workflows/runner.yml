name: "Run"

"on":
  workflow_dispatch:
    inputs:
      job:
        description: "Runner job"
        required: true
        default: "stale-retry"
        type: string
      source:
        description: "Dispatch source"
        required: false
        default: "manual"
        type: string
      cron:
        description: "Cron expression or manual marker"
        required: false
        default: "manual"
        type: string
      dispatched_at:
        description: "Dispatch timestamp"
        required: false
        type: string
      dry_run:
        description: "Run without writing changes"
        required: false
        default: "false"
        type: string
      max_items:
        description: "Optional item limit for smoke runs"
        required: false
        default: "0"
        type: string
      artists:
        description: "Optional comma-separated exact artist names for a targeted discovery or refresh"
        required: false
        default: ""
        type: string
      artist_shards:
        description: "JSON array of comma-separated artist batches for bounded album fanout"
        required: false
        default: '[""]'
        type: string
      target_album_ids:
        description: "Optional comma-separated exact private album IDs for a bounded album evidence refresh"
        required: false
        default: ""
        type: string
      target_track_ids:
        description: "Optional comma-separated exact track IDs for a Spotify-only recovery"
        required: false
        default: ""
        type: string
      job_run_id:
        description: "Optional Cloudflare/admin job id to report back against"
        required: false
        default: ""
        type: string
      classifier_job_id:
        description: "Optional classifier job id that fanout finalization must wait for"
        required: false
        default: ""
        type: string
      classifier_timeout_seconds:
        description: "Classifier watchdog alert threshold in seconds"
        required: false
        default: "3600"
        type: string
      batch_size:
        description: "Optional classifier batch size"
        required: false
        default: "50"
        type: string
      include_legacy:
        description: "Whether classifier should include legacy unclassified rows"
        required: false
        default: "false"
        type: string
      skip_recalc:
        description: "Skip the chart recalc after finalize (sample/test runs only — protects the live preview)"
        required: false
        default: "false"
        type: string
      bundle_sha256:
        description: "Optional immutable runner bundle SHA-256 pin"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: ngmc-runner-${{ github.event.inputs.job || github.run_id }}
  cancel-in-progress: false

jobs:
  plan-full-discovery-shards:
    if: ${{ github.event.inputs.job == 'full-discovery' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    env:
      RUNNER_KEY_JOB: full-discovery
      DISCOVERY_ARTIST_FILTER: ${{ github.event.inputs.artists }}
      DISCOVERY_SHARD_COUNT: "8"
      KEY_BROKER_URL: ${{ vars.KEY_BROKER_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install root deps
        run: npm install --omit=dev

      - name: Request OIDC token
        id: oidc
        run: |
          set -euo pipefail
          RESPONSE=$(curl -sS -f --max-time 20 \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=atlas-runner")
          OIDC_TOKEN=$(printf '%s' "$RESPONSE" | jq -r '.value // empty')
          test -n "${OIDC_TOKEN}"
          echo "::add-mask::${OIDC_TOKEN}"
          echo "oidc_token=${OIDC_TOKEN}" >> "${GITHUB_OUTPUT}"

      - name: Fetch configuration
        run: |
          set -euo pipefail
          test -n "${KEY_BROKER_URL}"
          RESPONSE=$(curl -sS -f --max-time 30 -X POST "${KEY_BROKER_URL%/}/v1/internal/runner/keys" \
            -H "Authorization: Bearer ${{ steps.oidc.outputs.oidc_token }}" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            -d '{"job":"full-discovery"}')
          test "$(echo "${RESPONSE}" | jq -r '.ok // false')" = "true"
          KEY_FILE="${RUNNER_TEMP}/runner-keys.json"
          umask 077
          echo "${RESPONSE}" | jq -c '.keys // {}' > "${KEY_FILE}"
          echo "RUNNER_KEY_FILE=${KEY_FILE}" >> "${GITHUB_ENV}"

      - name: Fetch runner bundle
        env:
          RUNNER_BUNDLE_EXPECTED_SHA256: ${{ github.event.inputs.bundle_sha256 }}
        run: |
          set -euo pipefail
          mkdir -p .runner-bundle
          node scripts/fetch-runner-bundle.mjs
          tar -xzf /tmp/runner-bundle.tgz -C .runner-bundle

      - name: Install bundle deps
        run: |
          set -euo pipefail
          if [ -f .runner-bundle/package-lock.json ]; then
            npm ci --omit=dev --prefix .runner-bundle
          elif [ -f .runner-bundle/package.json ]; then
            npm install --omit=dev --prefix .runner-bundle
          fi

      - name: Build balanced discovery shard matrix
        id: plan
        run: |
          set -euo pipefail
          MATRIX="$(node scripts/plan-full-discovery-shards.mjs)"
          echo "${MATRIX}" | jq -e '.include | length >= 1 and length <= 8' >/dev/null
          echo "${MATRIX}"
          echo "matrix=${MATRIX}" >> "${GITHUB_OUTPUT}"

  run:
    needs: plan-full-discovery-shards
    if: ${{ always() && github.event.inputs.job != 'daily-refresh-fanout' && github.event.inputs.job != 'full-discovery-refresh-fanout' && github.event.inputs.job != 'daily-refresh-fanout-finalize' && github.event.inputs.job != 'full-discovery-refresh-fanout-finalize' && github.event.inputs.job != 'album-refresh' && github.event.inputs.job != 'album-refresh-finalize' && github.event.inputs.job != 'recalculate-live-chart' && github.event.inputs.job != 'repair-baselined-metrics-2026-08-20' && (github.event.inputs.job != 'full-discovery' || needs.plan-full-discovery-shards.result == 'success') }}
    name: ${{ github.event.inputs.job == 'full-discovery' && format('discovery-scan ({0}, {1} artists, {2} work)', matrix.shard, matrix.artist_count, matrix.estimated_work) || 'run' }}
    runs-on: ubuntu-latest
    # Full Discovery scans the seeded catalogue end-to-end. It has its own
    # bounded timeout so a slow provider cannot terminate a healthy scan at
    # the generic runner cap.
    timeout-minutes: ${{ github.event.inputs.job == 'full-discovery' && 360 || 180 }}
    strategy:
      fail-fast: false
      max-parallel: ${{ github.event.inputs.job == 'full-discovery' && 8 || 2 }}
      matrix: ${{ fromJSON(github.event.inputs.job == 'full-discovery' && needs.plan-full-discovery-shards.outputs.matrix || format('{{"artist_shard":{0}}}', github.event.inputs.artist_shards || '[""]')) }}
    env:
      RUNNER_JOB: ${{ github.event.inputs.job }}
      RUNNER_KEY_JOB: ${{ (github.event.inputs.job == 'album-catalogue-scan' || github.event.inputs.job == 'album-collect-finalize') && 'album-collect' || github.event.inputs.job }}
      RUNNER_SOURCE: ${{ github.event.inputs.source }}
      RUNNER_CRON: ${{ github.event.inputs.cron }}
      RUNNER_DISPATCHED_AT: ${{ github.event.inputs.dispatched_at }}
      RUNNER_DRY_RUN: ${{ github.event.inputs.dry_run }}
      RUNNER_MAX_ITEMS: ${{ github.event.inputs.max_items }}
      # Full Discovery runs up to eight explicit, non-overlapping matrix shards.
      # Each shard keeps provider pressure at the established two-artist ceiling.
      ARTIST_DISCOVERY_CONCURRENCY: "2"
      RUNNER_TIMEOUT_MS: ${{ github.event.inputs.job == 'full-discovery' && '21000000' || '10800000' }}
      NGMC_TARGET_ARTISTS: ${{ matrix.artist_shard || github.event.inputs.artists }}
      NGMC_TARGET_ARTIST_IDS: ${{ matrix.artist_ids || '' }}
      NGMC_DISCOVERY_SHARD: ${{ matrix.shard || '' }}
      # A full album fanout runs two shards at once, with three artists per
      # shard. Total collector pressure therefore remains at the established
      # six-artist ceiling used by a normal targeted album run.
      ALBUM_COLLECTOR_ATLAS_CONCURRENCY: ${{ matrix.artist_shard && '3' || '6' }}
      ALBUM_COLLECTOR_DEFER_FINALIZE: ${{ matrix.artist_shard && '1' || '0' }}
      SPOTIFY_TARGET_TRACK_IDS: ${{ github.event.inputs.target_track_ids }}
      NGMC_TARGET_ALBUM_IDS: ${{ github.event.inputs.target_album_ids }}
      NGMC_JOB_RUN_ID: ${{ github.event.inputs.job_run_id }}
      NGMC_REFRESH_RUN_ID: ${{ github.event.inputs.job_run_id }}
      CLASSIFIER_JOB_ID: ${{ github.event.inputs.job_run_id }}
      CLASSIFIER_BATCH_SIZE: ${{ github.event.inputs.batch_size }}
      CLASSIFIER_INCLUDE_LEGACY: ${{ github.event.inputs.include_legacy }}
      KEY_BROKER_URL: ${{ vars.KEY_BROKER_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install root deps
        run: npm install --omit=dev

      - name: Request OIDC token
        id: oidc
        run: |
          set -euo pipefail
          OIDC_TOKEN=""
          for attempt in 1 2 3 4 5; do
            set +e
            RESPONSE=$(curl -sS -f --max-time 20 \
              -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=atlas-runner")
            curl_status=$?
            set -e
            if [ $curl_status -eq 0 ]; then
              TOKEN=$(printf '%s' "$RESPONSE" | jq -r '.value // empty' 2>/dev/null || true)
              if [ -n "${TOKEN}" ]; then
                OIDC_TOKEN="${TOKEN}"
                break
              fi
              echo "OIDC attempt ${attempt}: response had no .value (${#RESPONSE} bytes)"
            else
              echo "OIDC attempt ${attempt}: curl exit ${curl_status}"
            fi
            sleep $(( attempt * 3 ))
          done
          if [ -z "${OIDC_TOKEN}" ]; then
            echo "::error::OIDC token request failed after 5 attempts"
            exit 1
          fi
          echo "::add-mask::${OIDC_TOKEN}"
          echo "oidc_token=${OIDC_TOKEN}" >> "${GITHUB_OUTPUT}"
          echo "CHART_API_OIDC_TOKEN=${OIDC_TOKEN}" >> "${GITHUB_ENV}"
          echo "CLASSIFIER_API_TOKEN=${OIDC_TOKEN}" >> "${GITHUB_ENV}"

      - name: Fetch configuration
        id: keys
        run: |
          set -euo pipefail
          if [ -z "${KEY_BROKER_URL}" ]; then
            echo "KEY_BROKER_URL repo variable is not set"
            exit 1
          fi

          RESPONSE=$(curl -sS --max-time 30 -X POST "${KEY_BROKER_URL%/}/v1/internal/runner/keys" \
            -H "Authorization: Bearer ${{ steps.oidc.outputs.oidc_token }}" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            -d "{\"job\": \"${RUNNER_KEY_JOB}\"}")

          OK=$(echo "${RESPONSE}" | jq -r '.ok // false')
          if [ "${OK}" != "true" ]; then
            echo "Key fetch failed"
            echo "${RESPONSE}" | jq -r '.error // "unknown_error"'
            exit 1
          fi

          KEY_FILE="${RUNNER_TEMP}/runner-keys.json"
          umask 077
          echo "${RESPONSE}" | jq -c '.keys // {}' > "${KEY_FILE}"

          echo "${RESPONSE}" | jq -r '.keys | to_entries[] | @base64' | while IFS= read -r row; do
            value=$(echo "${row}" | base64 --decode | jq -r '.value')
            while IFS= read -r secret_line; do
              if [ -n "${secret_line}" ]; then
                echo "::add-mask::${secret_line}"
              fi
            done <<< "${value}"
          done

          echo "RUNNER_KEY_FILE=${KEY_FILE}" >> "${GITHUB_ENV}"
          echo "RUNNER_SUMMARY_FILE=${RUNNER_TEMP}/runner-summary.json" >> "${GITHUB_ENV}"
          echo "ok=${OK}" >> "${GITHUB_OUTPUT}"
          echo "job=$(echo "${RESPONSE}" | jq -r '.job // ""')" >> "${GITHUB_OUTPUT}"
          echo "key_count=$(echo "${RESPONSE}" | jq -r '.keys | length')" >> "${GITHUB_OUTPUT}"

      - name: Fetch runner bundle
        id: runner-bundle
        env:
          RUNNER_BUNDLE_EXPECTED_SHA256: ${{ github.event.inputs.bundle_sha256 }}
        run: |
          set -euo pipefail
          mkdir -p .runner-bundle
          node scripts/fetch-runner-bundle.mjs
          tar -xzf /tmp/runner-bundle.tgz -C .runner-bundle

      - name: Cache bundle dependency downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.cache/pip
          key: deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json', 'package.json', '.runner-bundle/package-lock.json', '.runner-bundle/package.json', '.runner-bundle/pipelines/sp/package-lock.json', '.runner-bundle/pipelines/sp/package.json', '.runner-bundle/**/requirements.txt') }}
          restore-keys: |
            deps-${{ runner.os }}-${{ runner.arch }}-

      - name: Cache classifier models and audio previews
        if: ${{ github.event.inputs.job == 'classifier-classify' || github.event.inputs.job == 'classifier-retrain' }}
        uses: actions/cache@v4
        with:
          path: |
            .runner-bundle/.venv
            .runner-bundle/.cache/ngmc-classifier
            .runner-bundle/.cache/huggingface
            .runner-bundle/.cache/torch
            ~/.cache/huggingface
            ~/.cache/torch
          key: classifier-${{ runner.os }}-${{ runner.arch }}-py312-${{ hashFiles('.runner-bundle/scripts/classifier/requirements-classifier.txt', '.runner-bundle/models/ngmc_production_model.joblib') }}
          restore-keys: |
            classifier-${{ runner.os }}-${{ runner.arch }}-py312-

      - name: Install classifier audio backend
        if: ${{ github.event.inputs.job == 'classifier-classify' || github.event.inputs.job == 'classifier-retrain' }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Prepare Playwright browser cache path
        run: mkdir -p ~/.cache/ms-playwright

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.runner-bundle/pipelines/sp/package-lock.json', '.runner-bundle/pipelines/sp/package.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-${{ runner.arch }}-

      - name: Install bundle deps
        run: |
          set -euo pipefail
          if [ -f .runner-bundle/package-lock.json ]; then
            npm ci --omit=dev --prefix .runner-bundle
          elif [ -f .runner-bundle/package.json ]; then
            npm install --omit=dev --prefix .runner-bundle
          fi
          if node -e "const p=require('./.runner-bundle/package.json'); process.exit(p.scripts && p.scripts.setup ? 0 : 1)" 2>/dev/null; then
            npm run setup --prefix .runner-bundle
          fi
          if [ -f .runner-bundle/requirements.txt ]; then
            pip install -r .runner-bundle/requirements.txt
          fi
          if [[ "${RUNNER_JOB}" == classifier-* ]] && [ -f .runner-bundle/scripts/classifier/requirements-classifier.txt ]; then
            python -m venv .runner-bundle/.venv
            . .runner-bundle/.venv/bin/activate
            if python -c 'import importlib; [importlib.import_module(name) for name in ("torch", "transformers", "librosa", "soundfile", "sklearn", "joblib", "requests")]'
            then
              echo "Classifier Python dependencies restored from cache"
            else
              python -m pip install --upgrade pip
              pip install -r .runner-bundle/scripts/classifier/requirements-classifier.txt
            fi
            echo "CLASSIFIER_PYTHON=${GITHUB_WORKSPACE}/.runner-bundle/.venv/bin/python" >> "${GITHUB_ENV}"
          fi

      - name: Run job
        id: run_job
        run: node scripts/run.mjs

      - name: Notify status
        if: always()
        run: |
          set -euo pipefail
          echo "Job completed: ${{ job.status }}"

          if [ -z "${KEY_BROKER_URL}" ]; then
            exit 0
          fi

          REPORT_OIDC_TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=atlas-runner" | jq -r '.value // ""')
          if [ -z "${REPORT_OIDC_TOKEN}" ]; then
            echo "Report OIDC token request returned no token"
            exit 1
          fi
          echo "::add-mask::${REPORT_OIDC_TOKEN}"

          SUMMARY_JSON="{}"
          if [ -n "${RUNNER_SUMMARY_FILE:-}" ] && [ -f "${RUNNER_SUMMARY_FILE}" ]; then
            SUMMARY_JSON=$(jq -c . "${RUNNER_SUMMARY_FILE}" 2>/dev/null || echo "{}")
          fi

          REPORT_BODY=$(jq -n \
            --arg job "${RUNNER_JOB}" \
            --arg status "${{ job.status }}" \
            --arg outcome "${{ steps.run_job.outcome }}" \
            --arg conclusion "${{ steps.run_job.conclusion }}" \
            --arg source "${RUNNER_SOURCE}" \
            --arg cron "${RUNNER_CRON}" \
            --arg dispatched_at "${RUNNER_DISPATCHED_AT}" \
            --arg dry_run "${RUNNER_DRY_RUN}" \
            --arg max_items "${RUNNER_MAX_ITEMS}" \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg run_id "${GITHUB_RUN_ID}" \
            --arg run_attempt "${GITHUB_RUN_ATTEMPT}" \
            --arg run_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --argjson summary "${SUMMARY_JSON}" \
            '{
              job: $job,
              status: $status,
              outcome: $outcome,
              conclusion: $conclusion,
              source: $source,
              cron: $cron,
              dispatched_at: $dispatched_at,
              dry_run: $dry_run,
              max_items: $max_items,
              repository: $repository,
              run_id: $run_id,
              run_attempt: $run_attempt,
              run_url: $run_url,
              summary: $summary
            }')

          # Broker report is best-effort: a non-2xx from the broker must NOT mark the
          # job failed when the actual work succeeded. Capture status and warn instead.
          REPORT_STATUS=$(curl -sS -o /dev/null -w "%{http_code}" -X POST "${KEY_BROKER_URL%/}/v1/internal/runner/report" \
            -H "Authorization: Bearer ${REPORT_OIDC_TOKEN}" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            -d "${REPORT_BODY}" || echo "000")
          if [ "${REPORT_STATUS}" -ge 200 ] && [ "${REPORT_STATUS}" -lt 300 ]; then
            echo "Broker report accepted (HTTP ${REPORT_STATUS})"
          else
            echo "::warning::Broker report rejected (HTTP ${REPORT_STATUS}); not failing the job"
          fi

  full-discovery-classifier-handoff:
    needs: [plan-full-discovery-shards, run]
    if: ${{ github.event.inputs.job == 'full-discovery' && needs.plan-full-discovery-shards.result == 'success' && needs.run.result == 'success' && github.event.inputs.dry_run != 'true' && github.event.inputs.artists == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      KEY_BROKER_URL: ${{ vars.KEY_BROKER_URL }}
    steps:
      - name: Request OIDC token
        id: oidc
        run: |
          set -euo pipefail
          RESPONSE=$(curl -sS -f --max-time 20 \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=atlas-runner")
          OIDC_TOKEN=$(printf '%s' "$RESPONSE" | jq -r '.value // empty')
          test -n "${OIDC_TOKEN}"
          echo "::add-mask::${OIDC_TOKEN}"
          echo "oidc_token=${OIDC_TOKEN}" >> "${GITHUB_OUTPUT}"

      - name: Queue classifier after all discovery shards
        run: |
          set -euo pipefail
          test -n "${KEY_BROKER_URL}"
          RESPONSE=$(curl -sS -f --max-time 30 -X POST "${KEY_BROKER_URL%/}/v1/internal/runner/keys" \
            -H "Authorization: Bearer ${{ steps.oidc.outputs.oidc_token }}" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            -d '{"job":"full-discovery"}')
          test "$(echo "${RESPONSE}" | jq -r '.ok // false')" = "true"
          CHART_URL=$(echo "${RESPONSE}" | jq -r '.keys.CLOUDFLARE_CHART_API_URL // .keys.CHART_API_WORKER_URL // .keys.CHART_API_URL // ""')
          CHART_TOKEN=$(echo "${RESPONSE}" | jq -r '.keys.CLOUDFLARE_CHART_API_REFRESH_TOKEN // .keys.CHART_API_REFRESH_TOKEN // .keys.CHART_API_TOKEN // ""')
          test -n "${CHART_URL}"
          test -n "${CHART_TOKEN}"
          echo "::add-mask::${CHART_TOKEN}"
          HANDOFF=$(curl -sS -f --max-time 60 -X POST "${CHART_URL%/}/v1/admin/jobs/classifier-classify" \
            -H "Authorization: Bearer ${CHART_TOKEN}" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            -d '{"batchSize":500,"source":"atlas-full-discovery-handoff"}')
          echo "${HANDOFF}"
          JOB_ID=$(echo "${HANDOFF}" | jq -r '.jobId // .result.summary.jobId // ""')
          test -n "${JOB_ID}"
          echo "Classifier queued after all discovery shards: ${JOB_ID}"

  album-finalize:
    needs: run
    if: ${{ always() && github.event.inputs.job == 'album-collect' && github.event.inputs.artist_shards != '[""]' && needs.run.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RUNNER_JOB: album-collect-finalize
      RUNNER_KEY_JOB: album-collect
      RUNNER_SOURCE: ${{ github.event.inputs.source }}
      RUNNER_CRON: ${{ github.event.inputs.cron }}
      RUNNER_DISPATCHED_AT: ${{ github.event.inputs.dispatched_at }}
      RUNNER_DRY_RUN: ${{ github.event.inputs.dry_run }}
      RUNNER_MAX_ITEMS: "0"
      NGMC_REFRESH_SNAPSHOT_AT: ${{ github.event.inputs.dispatched_at }}
      KEY_BROKER_URL: ${{ vars.KEY_BROKER_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install root deps
        run: npm install --omit=dev

      - name: Request OIDC token
        id: oidc
        run: |
          set -euo pipefail
          OIDC_TOKEN=""
          for attempt in 1 2 3 4 5; do
            set +e
            RESPONSE=$(curl -sS -f --max-time 20 \
              -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=atlas-runner")
            curl_status=$?
            set -e
            if [ $curl_status -eq 0 ]; then
              TOKEN=$(printf '%s' "$RESPONSE" | jq -r '.value // empty' 2>/dev/null || true)
              if [ -n "${TOKEN}" ]; then
                OIDC_TOKEN="${TOKEN}"
                break
              fi
            fi
            sleep $(( attempt * 3 ))
          done
          if [ -z "${OIDC_TOKEN}" ]; then
            echo "::error::OIDC token request failed after 5 attempts"
            exit 1
          fi
          echo "::add-mask::${OIDC_TOKEN}"
          echo "oidc_token=${OIDC_TOKEN}" >> "${GITHUB_OUTPUT}"
          echo "CHART_API_OIDC_TOKEN=${OIDC_TOKEN}" >> "${GITHUB_ENV}"

      - name: Fetch configuration
        run: |
          set -euo pipefail
          RESPONSE=$(curl -sS --max-time 30 -X POST "${KEY_BROKER_URL%/}/v1/internal/runner/keys" \
            -H "Authorization: Bearer ${{ steps.oidc.outputs.oidc_token }}" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            -d "{\"job\": \"${RUNNER_KEY_JOB}\"}")
          test "$(echo "${RESPONSE}" | jq -r '.ok // false')" = "true"
          KEY_FILE="${RUNNER_TEMP}/runner-keys.json"
          umask 077
          echo "${RESPONSE}" | jq -c '.keys // {}' > "${KEY_FILE}"
          echo "${RESPONSE}" | jq -r '.keys | to_entries[] | @base64' | while IFS= read -r row; do
            value=$(echo "${row}" | base64 --decode | jq -r '.value')
            while IFS= read -r secret_line; do
              test -z "${secret_line}" || echo "::add-mask::${secret_line}"
            done <<< "${value}"
          done
